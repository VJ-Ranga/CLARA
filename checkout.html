<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout | CLARA Sri Lanka</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="checkout">
  <script>Clara.checkoutHeader();</script>

  <form id="checkoutForm" class="co" onsubmit="handlePlaceOrder(event)">
    <div class="co__main"><div>
      <nav class="crumbs" aria-label="Checkout steps" style="margin-bottom:28px"><a href="cart.html">Bag</a><span class="sep"></span><span class="cur">Details &amp; payment</span><span class="sep"></span><span>Confirmation</span></nav>

      <h2>Contact</h2>
      <div class="fgrid">
        <div class="fld c6"><label for="chkEmail">Email *</label><input class="input" type="email" id="chkEmail" required autocomplete="email" placeholder="you@example.com"></div>
        <div class="fld c6"><label for="chkPhone">Mobile / WhatsApp *</label><input class="input" type="tel" id="chkPhone" required autocomplete="tel" placeholder="077 123 4567"></div>
      </div>

      <h2>Delivery</h2>
      <div class="fgrid">
        <div class="fld c3"><label for="chkFirstName">First name *</label><input class="input" type="text" id="chkFirstName" required autocomplete="given-name"></div>
        <div class="fld c3"><label for="chkLastName">Last name *</label><input class="input" type="text" id="chkLastName" required autocomplete="family-name"></div>
        <div class="fld c6"><label for="chkAddress">Address *</label><input class="input" type="text" id="chkAddress" required autocomplete="street-address" placeholder="House no., street"></div>
        <div class="fld c2"><label for="chkCity">City *</label><input class="input" type="text" id="chkCity" required autocomplete="address-level2"></div>
        <div class="fld c2"><label for="chkPostal">Postal code</label><input class="input" type="text" id="chkPostal" autocomplete="postal-code"></div>
        <div class="fld c2"><label for="chkProvince">District</label><input class="input" type="text" id="chkProvince" autocomplete="address-level1"></div>
        <div class="fld c6"><label for="chkNotes">Delivery notes (optional)</label><input class="input" type="text" id="chkNotes" placeholder="Gift wrapping, call before arrival…"></div>
      </div>

      <h2>Delivery method</h2>
      <div>
        <label class="ropt"><input type="radio" name="checkoutShipping" value="western" checked onchange="handleShippingChange('western')"><span><span class="ropt__t">Colombo &amp; Western Province</span><span class="ropt__d">Insured door-to-door courier · 1–2 business days</span></span><span class="ropt__p" id="rateWesternText">Rs. 350</span></label>
        <label class="ropt"><input type="radio" name="checkoutShipping" value="islandwide" onchange="handleShippingChange('islandwide')"><span><span class="ropt__t">Islandwide courier</span><span class="ropt__d">Pronto, Domex or Certis Lanka · 2–4 business days</span></span><span class="ropt__p" id="rateIslandwideText">Rs. 550</span></label>
        <label class="ropt"><input type="radio" name="checkoutShipping" value="pickup" onchange="handleShippingChange('pickup')"><span><span class="ropt__t">Collect from our boutique</span><span class="ropt__d">587/A Galle Road, Mount Lavinia · daily 9:30 AM – 7:30 PM</span></span><span class="ropt__p green">Free</span></label>
      </div>

      <h2>Payment</h2>
      <div>
        <label class="ropt"><input type="radio" name="chkPayment" value="card" checked onchange="togglePaymentPanels('card')"><span><span class="ropt__t">Credit or debit card</span><span class="ropt__d">Visa, Mastercard, Amex</span></span><span data-icon="card"></span>
          <div class="ropt__x" id="cardFieldsPanel"><div class="cardf">
            <div class="fld full"><label>Card number</label><input class="input" type="text" inputmode="numeric" placeholder="1234 5678 9012 3456" maxlength="19" autocomplete="cc-number"></div>
            <div class="fld"><label>Expiry</label><input class="input" type="text" placeholder="MM / YY" maxlength="7" autocomplete="cc-exp"></div>
            <div class="fld"><label>Security code</label><input class="input" type="password" inputmode="numeric" placeholder="CVC" maxlength="4" autocomplete="cc-csc"></div>
          </div></div>
        </label>
        <label class="ropt"><input type="radio" name="chkPayment" value="bank_transfer" onchange="togglePaymentPanels('bank_transfer')"><span><span class="ropt__t">Direct bank transfer</span><span class="ropt__d">Commercial Bank of Ceylon</span></span><span data-icon="bank"></span>
          <div class="ropt__x hidden" id="bankDetailsPanel"><div class="bank"><dl>
            <dt>Bank</dt><dd>Commercial Bank of Ceylon PLC</dd>
            <dt>Account name</dt><dd>CLARA BAGS (DJ INDUSTRIES)</dd>
            <dt>Account no.</dt><dd>8003492819</dd>
            <dt>Branch</dt><dd>Mount Lavinia</dd>
          </dl><p class="small" style="margin-top:8px">Use your order number as the reference and WhatsApp the slip to 077 317 3217.</p></div></div>
        </label>
        <label class="ropt"><input type="radio" name="chkPayment" value="cod" onchange="togglePaymentPanels('cod')"><span><span class="ropt__t">Cash on delivery</span><span class="ropt__d">Pay the courier on arrival</span></span><span data-icon="cash"></span></label>
        <label class="ropt"><input type="radio" name="chkPayment" value="showroom" onchange="togglePaymentPanels('showroom')"><span><span class="ropt__t">Pay at the boutique</span><span class="ropt__d">We'll reserve your bag in Mount Lavinia</span></span><span data-icon="store"></span></label>
      </div>

      <label class="check" style="margin-top:24px"><input type="checkbox" required checked><span>I agree to CLARA's 7-day inspection &amp; exchange guarantee and delivery terms.</span></label>
      <button type="submit" id="chkPlaceOrderBtn" class="btn btn-block" style="margin-top:22px;min-height:56px"><span data-icon="lock"></span><span id="chkBtnText">Place order</span></button>
    </div></div>

    <aside class="co__side"><div>
      <div class="lines" id="checkoutOrderItems"></div>
      <div class="coupon" style="margin-top:26px">
        <input type="text" id="checkoutCouponInput" placeholder="Voucher code" aria-label="Voucher code">
        <button type="button" class="btn btn-outline" onclick="handleCheckoutApplyCoupon()">Apply</button>
      </div>
      <p class="hint" id="chkCouponHint">First order? Use <button type="button" onclick="document.getElementById('checkoutCouponInput').value='WELCOME10'; handleCheckoutApplyCoupon()">WELCOME10</button> for 10% off.</p>
      <div class="sum-rows" style="margin-top:22px;padding-top:20px;border-top:1px solid var(--line-dark)">
        <div><span>Subtotal</span><span id="chkSubtotal">Rs. 0</span></div>
        <div id="chkDiscountRow" class="green hidden"><span id="chkDiscountLabel">Voucher</span><span id="chkDiscountVal">−Rs. 0</span></div>
        <div><span>Delivery</span><span id="chkShippingFee">Rs. 350</span></div>
      </div>
      <div class="sum-total"><span>Total</span><b id="chkGrandTotal">Rs. 0</b></div>
    </div></aside>
  </form>

  <script>Clara.minimalFooter();</script>

  <script>
    let activeShippingMethod = "western";

    document.addEventListener("DOMContentLoaded", () => {
      if (!getCart().length) { location.href = "cart.html"; return; }
      renderCheckoutReview();
    });

    function renderCheckoutReview() {
      const t = calculateOrderTotals(activeShippingMethod);
      document.getElementById("checkoutOrderItems").innerHTML = getCart().map(item => `
        <div class="line"><div class="th"><img src="${item.image}" alt="${item.name}"><em>${item.quantity}</em></div>
          <div>${item.name}<small>${item.color}</small></div><span>${formatLKR(item.price * item.quantity)}</span></div>`).join("");
      document.getElementById("chkSubtotal").textContent = formatLKR(t.subtotal);
      const row = document.getElementById("chkDiscountRow");
      if (t.discountAmount > 0) {
        row.classList.remove("hidden");
        document.getElementById("chkDiscountLabel").textContent = `Voucher ${t.coupon.code}`;
        document.getElementById("chkDiscountVal").textContent = `−${formatLKR(t.discountAmount)}`;
        document.getElementById("checkoutCouponInput").value = t.coupon.code;
        document.getElementById("chkCouponHint").classList.add("hidden");
      } else row.classList.add("hidden");
      const fee = document.getElementById("chkShippingFee");
      fee.textContent = t.isFreeDelivery ? "Free" : formatLKR(t.shippingFee);
      fee.className = t.isFreeDelivery ? "green" : "";
      document.getElementById("chkGrandTotal").textContent = formatLKR(t.grandTotal);
      const free = t.subtotal >= t.freeDeliveryThreshold;
      [["rateWesternText", "Rs. 350"], ["rateIslandwideText", "Rs. 550"]].forEach(([id, v]) => {
        const el = document.getElementById(id); el.textContent = free ? "Free" : v; el.classList.toggle("green", free);
      });
    }

    function handleShippingChange(m) { activeShippingMethod = m; renderCheckoutReview(); }

    function togglePaymentPanels(mode) {
      document.getElementById("cardFieldsPanel").classList.toggle("hidden", mode !== "card");
      document.getElementById("bankDetailsPanel").classList.toggle("hidden", mode !== "bank_transfer");
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("chkPlaceOrderBtn");
      const txt = document.getElementById("chkBtnText");
      btn.disabled = true; txt.textContent = "Placing your order…";
      const v = id => document.getElementById(id).value.trim();
      const form = {
        firstName: v("chkFirstName"), lastName: v("chkLastName"), email: v("chkEmail"), phone: v("chkPhone"),
        address: v("chkAddress"), city: v("chkCity"), postalCode: v("chkPostal"),
        shippingMethod: activeShippingMethod,
        paymentMethod: document.querySelector('input[name="chkPayment"]:checked').value,
        notes: v("chkNotes")
      };
      setTimeout(() => {
        const r = placeOrder(form);
        if (r.success) location.href = "order-confirmation.html";
        else { showToast(r.message); btn.disabled = false; txt.textContent = "Place order"; }
      }, 900);
    }

    function handleCheckoutApplyCoupon() {
      const r = applyCouponCode(document.getElementById("checkoutCouponInput").value);
      showToast(r.message);
      renderCheckoutReview();
    }
  </script>
</body>
</html>
