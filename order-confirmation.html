<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | CLARA Sri Lanka</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="confirmation">
  <script>Clara.header();</script>

  <main id="main" class="section">
    <div class="container narrow" id="orderConfirmationWrapper"></div>
  </main>

  <script>Clara.footer();</script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const order = getLastOrder();
      const w = document.getElementById("orderConfirmationWrapper");
      const ic = Clara.icon, e = Clara.escapeHtml;

      if (!order) {
        w.innerHTML = `<div class="empty">${ic("bag")}<h3>No recent order</h3><p>You haven't placed an order in this browser yet.</p><a href="shop.html" class="btn">Discover handbags</a></div>`;
        return;
      }
      const pay = { card: "Card", bank_transfer: "Bank transfer", cod: "Cash on delivery", showroom: "Pay at boutique" };
      const c = order.customer;

      w.innerHTML = `
        <div class="confirm">
          <div class="tick">${ic("check")}</div>
          <span class="kicker">Order #${e(order.orderNumber)}</span>
          <h1 class="title-lg">Thank you, <i>${e(c.firstName)}</i></h1>
          <p class="body-lg" style="max-width:560px">Your order has been received. Our team will contact you on <b>${e(c.phone)}</b> to confirm dispatch, and a copy is on its way to ${e(c.email)}.</p>
        </div>

        <div class="omt">
          <div><small>Order</small><span>#${e(order.orderNumber)}</span></div>
          <div><small>Date</small><span>${e(order.orderDate)}</span></div>
          <div><small>Total</small><span>${formatLKR(order.grandTotal)}</span></div>
          <div><small>Payment</small><span>${pay[order.paymentMethod] || e(order.paymentMethod)}</span></div>
        </div>

        ${order.paymentMethod === "bank_transfer" ? `
          <div class="notice">${ic("bank")}<div>
            <h4>Complete your bank transfer</h4>
            <p>Please transfer <b>${formatLKR(order.grandTotal)}</b> within 24 hours, using <b>${e(order.orderNumber)}</b> as the reference.</p>
            <div class="bank" style="background:#fff;margin-top:12px"><dl>
              <dt>Bank</dt><dd>Commercial Bank of Ceylon PLC</dd>
              <dt>Account name</dt><dd>CLARA BAGS (DJ INDUSTRIES)</dd>
              <dt>Account no.</dt><dd>8003492819</dd>
              <dt>Branch</dt><dd>Mount Lavinia</dd>
            </dl></div>
            <a class="btn btn-outline btn-sm no-print" style="margin-top:14px" target="_blank" rel="noopener" href="${Clara.waLink(`Hello CLARA, here is my bank slip for order #${order.orderNumber}.`)}">${ic("whatsapp")}Send slip on WhatsApp</a>
          </div></div>` : ""}
        ${order.paymentMethod === "cod" ? `<div class="notice">${ic("truck")}<div><h4>Cash on delivery</h4><p>Our courier will call <b>${e(c.phone)}</b> before delivering to ${e(c.address)}, ${e(c.city)}. Please have <b>${formatLKR(order.grandTotal)}</b> ready.</p></div></div>` : ""}
        ${order.paymentMethod === "showroom" ? `<div class="notice">${ic("store")}<div><h4>Reserved at our boutique</h4><p>Your bag is waiting at 587/A Galle Road, Mount Lavinia — open daily 9:30 AM to 7:30 PM.</p></div></div>` : ""}

        <div class="box">
          <h3>Order summary</h3>
          <div class="lines">${order.items.map(i => `
            <div class="line"><div class="th"><img src="${i.image}" alt="${e(i.name)}"><em>${i.quantity}</em></div><div>${e(i.name)}<small>${e(i.color)} · ${e(i.sku)}</small></div><span>${formatLKR(i.price * i.quantity)}</span></div>`).join("")}
          </div>
          <div class="sum-rows" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">
            <div><span>Subtotal</span><span>${formatLKR(order.subtotal)}</span></div>
            ${order.discount > 0 ? `<div class="green"><span>Voucher</span><span>−${formatLKR(order.discount)}</span></div>` : ""}
            <div><span>${e(order.shippingMethod.name)}</span><span>${order.shippingFee === 0 ? "Free" : formatLKR(order.shippingFee)}</span></div>
          </div>
          <div class="sum-total"><span>Total</span><b>${formatLKR(order.grandTotal)}</b></div>
        </div>

        <div class="box two">
          <div><h3>Delivery</h3><p>${e(c.firstName)} ${e(c.lastName)}<br>${e(c.address)}<br>${e(c.city)}${c.postalCode ? ", " + e(c.postalCode) : ""}<br>Sri Lanka</p></div>
          <div><h3>Contact</h3><p>${e(c.phone)}<br>${e(c.email)}</p>${c.notes ? `<p class="small" style="margin-top:8px">Notes: ${e(c.notes)}</p>` : ""}</div>
        </div>

        <div class="no-print" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:36px">
          <a href="shop.html" class="btn">Continue shopping</a>
          <button type="button" class="btn btn-outline" onclick="window.print()">${ic("printer")}Print receipt</button>
        </div>`;
    });
  </script>
</body>
</html>
