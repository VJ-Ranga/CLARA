<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handbags | CLARA Sri Lanka</title>
  <meta name="description" content="Shop CLARA handbags — structured vanity bags, work and laptop totes, crossbody bags, evening clutches, weekenders and small leather goods. Islandwide delivery across Sri Lanka.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="shop">
  <script>Clara.header();</script>

  <main id="main">
    <section class="shop-head" aria-labelledby="shopTitle">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep"></span><span class="cur" id="crumbCur">Handbags</span></nav>
      <div class="shead">
        <div><span class="kicker">Shop</span><h1 id="shopTitle">Handbags</h1></div>
        <span class="shead__count" id="countText" aria-live="polite"></span>
      </div>
    </section>
    <nav class="cat-links shop-tabs" id="catLinks" aria-label="Categories"></nav>

    <div class="shop">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters__head"><span>Filter</span><button type="button" class="icon-btn" onclick="toggleFilters(false)" aria-label="Close filters"><span data-icon="close"></span></button></div>
        <div class="fgroup"><button type="button" onclick="this.parentElement.classList.toggle('is-closed')">Colour <span data-icon="chev-down"></span></button><div class="fopts" id="fColour"></div></div>
        <div class="fgroup"><button type="button" onclick="this.parentElement.classList.toggle('is-closed')">Price <span data-icon="chev-down"></span></button><div class="fopts" id="fPrice"></div></div>
        <button type="button" class="clear-filters" onclick="resetFilters()">Clear all filters</button>
      </aside>
      <div class="filters__foot" id="filtersFoot">
        <button type="button" class="btn btn-outline" onclick="resetFilters()">Clear</button>
        <button type="button" class="btn" id="showResults" onclick="toggleFilters(false)">Show results</button>
      </div>

      <section>
        <div class="toolbar">
          <button type="button" class="filter-toggle" onclick="toggleFilters(true)"><span data-icon="filter"></span>Filter</button>
          <div class="toolbar__right">
            <label class="select"><span class="hide-mobile">Sort by</span>
              <select id="sortSelect" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="new">New arrivals</option>
                <option value="price-low">Price, low to high</option>
                <option value="price-high">Price, high to low</option>
                <option value="rating">Top rated</option>
              </select>
              <span data-icon="chev-down"></span>
            </label>
            <div class="density" role="group" aria-label="Grid size">
              <button type="button" data-cols="3" aria-label="3 per row"><svg viewBox="0 0 18 18"><rect x="0" y="0" width="5" height="18"/><rect x="6.5" y="0" width="5" height="18"/><rect x="13" y="0" width="5" height="18"/></svg></button>
              <button type="button" data-cols="4" class="is-active" aria-label="4 per row"><svg viewBox="0 0 18 18"><rect x="0" y="0" width="3.6" height="18"/><rect x="4.8" y="0" width="3.6" height="18"/><rect x="9.6" y="0" width="3.6" height="18"/><rect x="14.4" y="0" width="3.6" height="18"/></svg></button>
            </div>
          </div>
        </div>
        <div class="active-filters" id="activeFilters"></div>
        <div class="grid" id="catalogGrid"></div>
      </section>
    </div>
  </main>

  <script>Clara.footer();</script>

  <script>
    const COPY = {
      all: ["Handbags", "Structured vanity bags, polished work totes, hands-free crossbodies and evening clutches — each chosen to make you feel put-together."],
      new: ["New In", "The latest silhouettes to arrive at our Mount Lavinia boutique."],
      vanity: ["Structured Vanity", "Sculpted top-handle bags that hold their shape — for weddings, dinners and every polished day."],
      totes: ["Work & Totes", "Room for your laptop, documents and everything in between."],
      crossbody: ["Crossbody & Slings", "Hands-free and effortlessly chic, for weekends and everything spontaneous."],
      shoulder: ["Shoulder Bags", "Soft pleats, baguettes and turn-lock satchels that sit beautifully under the arm."],
      clutches: ["Evening", "Jewelled minaudières and sculptural clutches for nights to remember."],
      travel: ["Travel & Weekender", "Cabin-friendly holdalls with a separate shoe compartment."],
      wallets: ["Small Leather Goods", "Quilted continental wallets — the perfect gift, beautifully boxed."],
      saved: ["Wishlist", "The pieces you've fallen for, saved in one place."]
    };

    const COLOUR_FAMILIES = [
      { key: "black", label: "Black", hex: "#141416", words: ["noir", "black", "onyx", "midnight"] },
      { key: "neutral", label: "Ivory & Cream", hex: "#EFE8DC", words: ["ivory", "alabaster", "cream", "oatmeal", "ecru"] },
      { key: "brown", label: "Brown & Tan", hex: "#8B5A2B", words: ["cognac", "tan", "camel", "espresso", "brown", "chestnut", "cocoa", "taupe", "butterscotch", "mustard"] },
      { key: "red", label: "Red & Pink", hex: "#7A1B24", words: ["bordeaux", "wine", "merlot", "scarlet", "red", "quartz", "blush", "rose"] },
      { key: "green", label: "Green", hex: "#1C4D3A", words: ["green", "emerald", "olive"] },
      { key: "metal", label: "Metallic", hex: "#C9B07A", words: ["gold", "silver", "champagne", "sterling", "bronze"] }
    ];
    const PRICES = [
      { key: "under4", label: "Under Rs. 4,000", test: p => p.price < 4000 },
      { key: "4to6", label: "Rs. 4,000 – 6,000", test: p => p.price >= 4000 && p.price <= 6000 },
      { key: "over6", label: "Over Rs. 6,000", test: p => p.price > 6000 }
    ];

    const families = (p) => new Set(p.colors.flatMap(c => COLOUR_FAMILIES.filter(f => f.words.some(w => c.toLowerCase().includes(w))).map(f => f.key)));

    const params = new URLSearchParams(location.search);
    const state = {
      cat: params.get("saved") ? "saved" : (params.get("cat") || "all"),
      q: (params.get("q") || "").trim().toLowerCase(),
      colours: new Set(),
      price: params.get("price") || "",
      sort: "featured"
    };
    if (!COPY[state.cat]) state.cat = "all";

    const inCat = (p, cat) => cat === "all" || (cat === "new" && p.isNew) || (cat === "saved" && Clara.getWishlist().includes(p.id)) || p.category === cat;

    function renderHead() {
      const [title, intro] = COPY[state.cat];
      document.getElementById("shopTitle").textContent = state.q ? `Results for “${state.q}”` : title;
      document.getElementById("crumbCur").textContent = title;
      document.title = `${title} | CLARA Sri Lanka`;
      const links = [["all", "All"], ["new", "New In"], ...CATEGORY_META.map(c => [c.key, c.label])];
      document.getElementById("catLinks").innerHTML = links.map(([k, l]) => `<a href="#" data-cat="${k}" class="${state.cat === k ? "is-active" : ""}">${l}</a>`).join("");
      document.querySelectorAll("#catLinks a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); setCat(a.dataset.cat); }));
      const nav = document.getElementById("catLinks"), act = nav.querySelector("a.is-active");
      if (act) nav.scrollLeft = act.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2;
    }

    function renderFilters() {
      document.getElementById("fColour").innerHTML = COLOUR_FAMILIES.map(f => `
        <label class="fopt"><input type="checkbox" value="${f.key}" ${state.colours.has(f.key) ? "checked" : ""}><span class="sw" style="background:${f.hex}"></span>${f.label}<span class="n">${CLARA_PRODUCTS.filter(p => families(p).has(f.key)).length}</span></label>`).join("");
      document.getElementById("fPrice").innerHTML = [{ key: "", label: "Any price" }, ...PRICES].map(pr => `
        <label class="fopt"><input type="radio" name="fprice" value="${pr.key}" ${state.price === pr.key ? "checked" : ""}>${pr.label}</label>`).join("");

      document.querySelectorAll("#fColour input").forEach(i => i.addEventListener("change", () => { i.checked ? state.colours.add(i.value) : state.colours.delete(i.value); renderGrid(); }));
      document.querySelectorAll("#fPrice input").forEach(i => i.addEventListener("change", () => { state.price = i.value; renderGrid(); }));
    }

    function setCat(cat) {
      state.cat = cat;
      state.q = "";
      const url = new URL(location.href);
      ["cat", "saved", "q"].forEach(k => url.searchParams.delete(k));
      if (cat === "saved") url.searchParams.set("saved", "1"); else if (cat !== "all") url.searchParams.set("cat", cat);
      history.replaceState(null, "", url);
      renderHead(); renderFilters(); renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById("catalogGrid");
      let list = CLARA_PRODUCTS.filter(p => {
        if (!inCat(p, state.cat)) return false;
        if (state.q && !Clara.matches(p, state.q)) return false;
        if (state.colours.size && ![...families(p)].some(f => state.colours.has(f))) return false;
        if (state.price && !PRICES.find(x => x.key === state.price).test(p)) return false;
        return true;
      });
      const sorts = {
        "price-low": (a, b) => a.price - b.price,
        "price-high": (a, b) => b.price - a.price,
        rating: (a, b) => b.rating - a.rating,
        new: (a, b) => b.isNew - a.isNew,
        featured: (a, b) => b.isFeatured - a.isFeatured
      };
      list.sort(sorts[state.sort]);

      document.getElementById("countText").textContent = `${list.length} ${list.length === 1 ? "product" : "products"}`;
      document.getElementById("showResults").textContent = `Show ${list.length} ${list.length === 1 ? "result" : "results"}`;

      const chips = [];
      if (state.q) chips.push([`Search: ${state.q}`, () => { state.q = ""; renderHead(); renderGrid(); }]);
      state.colours.forEach(c => chips.push([COLOUR_FAMILIES.find(f => f.key === c).label, () => { state.colours.delete(c); renderFilters(); renderGrid(); }]));
      if (state.price) chips.push([PRICES.find(x => x.key === state.price).label, () => { state.price = ""; renderFilters(); renderGrid(); }]);
      const af = document.getElementById("activeFilters");
      af.innerHTML = chips.map(([l], i) => `<button type="button" data-i="${i}">${Clara.escapeHtml(l)} ${Clara.icon("close")}</button>`).join("");
      af.querySelectorAll("button").forEach(b => b.addEventListener("click", chips[b.dataset.i][1]));
      af.classList.toggle("hidden", !chips.length);

      if (!list.length) {
        const saved = state.cat === "saved" && !state.colours.size && !state.price && !state.q;
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${Clara.icon(saved ? "heart" : "search")}
          <h3>${saved ? "Your wishlist is empty" : "No products found"}</h3>
          <p>${saved ? "Tap the heart on any bag to save it here." : "Try removing a filter or browse the full collection."}</p>
          <button type="button" class="btn btn-outline" onclick="resetFilters()">View all handbags</button></div>`;
        return;
      }
      grid.innerHTML = list.map((p, i) => Clara.productCard(p, { index: i })).join("");
      Clara.observeReveals(grid);
    }

    function resetFilters() {
      state.colours.clear(); state.price = ""; state.q = "";
      setCat("all");
      document.getElementById("sortSelect").value = "featured"; state.sort = "featured";
      renderGrid();
    }

    function toggleFilters(open) {
      document.getElementById("filters").classList.toggle("is-open", open);
      document.getElementById("filtersFoot").classList.toggle("is-open", open);
      document.body.classList.toggle("no-scroll", open);
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("sortSelect").addEventListener("change", e => { state.sort = e.target.value; renderGrid(); });
      document.querySelectorAll(".density button").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll(".density button").forEach(x => x.classList.toggle("is-active", x === b));
        document.getElementById("catalogGrid").classList.toggle("cols-3", b.dataset.cols === "3");
      }));
      document.getElementById("filters").addEventListener("click", e => { if (e.target.id === "filters") toggleFilters(false); });
      renderHead(); renderFilters(); renderGrid();
      Clara.hydrateIcons();
      window.addEventListener("clara:wishlist-updated", () => { renderFilters(); if (state.cat === "saved") renderGrid(); });
    });
  </script>
</body>
</html>
