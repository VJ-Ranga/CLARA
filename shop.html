<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Collection | CLARA Bags Sri Lanka</title>
  <meta name="description" content="Shop CLARA handbags — structured vanity bags, work and laptop totes, crossbody bags, evening clutches, weekenders and wallets. Islandwide delivery across Sri Lanka.">
  <meta name="theme-color" content="#FBF7F3">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="shop">
  <script>Clara.header();</script>

  <main id="main">
    <section class="page-hero">
      <div class="container page-hero__inner">
        <div>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep"></span><span class="current" id="crumbCurrent">The collection</span></nav>
          <h1 class="display" id="shopTitle" style="font-size:clamp(2.6rem,5vw,4.4rem)">The <em>collection</em></h1>
          <p class="lead" id="shopIntro">Structured vanity bags, polished work totes, hands-free crossbodies and evening clutches — each chosen to make you feel put-together, wherever the day takes you.</p>
        </div>
        <div class="page-hero__img"><img id="shopHeroImg" src="assets/img/hero-palms.jpg" alt=""></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="container toolbar__inner">
        <div class="chip-row" id="catChips" role="tablist" aria-label="Categories"></div>
        <div class="toolbar__tools">
          <label class="field-pill">
            <span data-icon="search"></span>
            <span class="visually-hidden">Search the collection</span>
            <input type="search" id="catalogSearchInput" placeholder="Search bags" autocomplete="off">
          </label>
          <label class="field-pill">
            <span class="visually-hidden">Sort by</span>
            <span data-icon="menu"></span>
            <select id="catalogSortSelect">
              <option value="featured">Featured</option>
              <option value="new">Newest</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="rating">Top rated</option>
            </select>
            <span data-icon="chev-down" data-icon-class="caret" style="position:absolute;right:14px;pointer-events:none"></span>
          </label>
        </div>
      </div>
    </div>

    <section class="container" style="padding-bottom:clamp(64px,8vw,120px)">
      <div class="result-line">
        <span id="catalogCountText">Showing all styles</span>
        <span class="small">Free delivery over Rs. 10,000</span>
      </div>
      <div class="product-grid" id="catalogGrid"></div>
    </section>
  </main>

  <script>Clara.footer();</script>

  <script>
    const CHIP_DEFS = [
      { key: "all", label: "All bags" },
      { key: "new", label: "New in" },
      ...CATEGORY_META.map(c => ({ key: c.key, label: c.label })),
      { key: "saved", label: "Wishlist", icon: "heart" }
    ];

    const CAT_COPY = {
      all: ["The <em>collection</em>", "Structured vanity bags, polished work totes, hands-free crossbodies and evening clutches — each chosen to make you feel put-together, wherever the day takes you.", "assets/img/hero-palms.jpg"],
      new: ["New <em>in</em>", "The latest silhouettes to arrive at our Mount Lavinia boutique — fresh shapes, new shades and pieces you won't see everywhere.", "assets/img/mood-weekend.jpg"],
      vanity: ["Structured <em>vanity</em>", "Sculpted top-handle bags that hold their shape beautifully — made for weddings, dinners and every day you want to feel polished.", "assets/img/cat-vanity.jpg"],
      totes: ["Work &amp; <em>totes</em>", "Room for your laptop, documents and everything in between — totes that look as composed at 6 PM as they did at 9.", "assets/img/mood-day.jpg"],
      crossbody: ["Crossbody &amp; <em>slings</em>", "Hands-free and effortlessly chic — for shopping in Colombo, weekends away and everything spontaneous.", "assets/img/cat-crossbody.jpg"],
      shoulder: ["Shoulder <em>bags</em>", "Soft pleats, baguettes and turn-lock satchels that sit comfortably under the arm all day long.", "assets/img/cat-shoulder.jpg"],
      clutches: ["The evening <em>edit</em>", "Jewelled minaudières and sculptural clutches for weddings, homecomings and nights to remember.", "assets/img/evening-gown.jpg"],
      travel: ["Travel &amp; <em>weekender</em>", "Cabin-friendly holdalls with a separate shoe compartment — for beach weekends and business trips alike.", "assets/img/cat-travel.jpg"],
      wallets: ["Wallets &amp; <em>gifts</em>", "Quilted continental wallets and small leather goods — the perfect gift, beautifully boxed.", "assets/img/cat-wallets.jpg"],
      saved: ["Your <em>wishlist</em>", "The pieces you've fallen for, saved in one place. Tap the heart on any bag to add it here.", "assets/img/ig-rose.jpg"]
    };

    const params = new URLSearchParams(location.search);
    let activeCategory = params.get("saved") ? "saved" : (params.get("cat") || "all");
    if (!CAT_COPY[activeCategory]) activeCategory = "all";
    let searchQuery = (params.get("q") || "").trim().toLowerCase();
    let sortOrder = "featured";

    function renderChips() {
      const row = document.getElementById("catChips");
      row.innerHTML = CHIP_DEFS.map(c => {
        let n;
        if (c.key === "all") n = CLARA_PRODUCTS.length;
        else if (c.key === "new") n = CLARA_PRODUCTS.filter(p => p.isNew).length;
        else if (c.key === "saved") n = Clara.getWishlist().length;
        else n = CLARA_PRODUCTS.filter(p => p.category === c.key).length;
        return `<button type="button" role="tab" class="chip ${c.key === activeCategory ? "is-active" : ""}" data-cat="${c.key}" aria-selected="${c.key === activeCategory}">
          ${c.icon ? Clara.icon(c.icon) : ""}${c.label}<span class="n">${n}</span></button>`;
      }).join("");
      row.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        const url = new URL(location.href);
        url.searchParams.delete("cat"); url.searchParams.delete("saved");
        if (activeCategory === "saved") url.searchParams.set("saved", "1");
        else if (activeCategory !== "all") url.searchParams.set("cat", activeCategory);
        history.replaceState(null, "", url);
        renderChips();
        renderHero();
        renderCatalog();
      }));
      const active = row.querySelector(".is-active");
      if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
    }

    function renderHero() {
      const [title, intro, img] = CAT_COPY[activeCategory];
      document.getElementById("shopTitle").innerHTML = title;
      document.getElementById("shopIntro").textContent = intro;
      document.getElementById("shopHeroImg").src = img;
      const plain = title.replace(/<[^>]+>/g, "").replace("&amp;", "&");
      document.getElementById("crumbCurrent").textContent = plain;
      document.title = `${plain} | CLARA Bags Sri Lanka`;
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      const countText = document.getElementById("catalogCountText");
      const saved = Clara.getWishlist();

      let filtered = CLARA_PRODUCTS.filter(p => {
        const matchesCat = activeCategory === "all"
          || (activeCategory === "new" && p.isNew)
          || (activeCategory === "saved" && saved.includes(p.id))
          || p.category === activeCategory;
        const haystack = [p.name, p.sku, p.categoryName, p.material, p.colors.join(" "), p.shortDescription].join(" ").toLowerCase();
        return matchesCat && (!searchQuery || haystack.includes(searchQuery));
      });

      if (sortOrder === "price-low") filtered.sort((a, b) => a.price - b.price);
      else if (sortOrder === "price-high") filtered.sort((a, b) => b.price - a.price);
      else if (sortOrder === "rating") filtered.sort((a, b) => b.rating - a.rating);
      else if (sortOrder === "new") filtered.sort((a, b) => (b.isNew - a.isNew));
      else filtered.sort((a, b) => (b.isFeatured - a.isFeatured));

      countText.innerHTML = `Showing <b>${filtered.length}</b> ${filtered.length === 1 ? "style" : "styles"}${searchQuery ? ` for “${Clara.escapeHtml(searchQuery)}”` : ""}`;

      if (filtered.length === 0) {
        const isSaved = activeCategory === "saved" && !searchQuery;
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="bubble">${Clara.icon(isSaved ? "heart" : "search")}</div>
            <h3>${isSaved ? "Your wishlist is empty" : "Nothing found"}</h3>
            <p>${isSaved ? "Tap the heart on any bag to save it for later." : "Try another colour, style or category — or browse the full collection."}</p>
            <button type="button" class="btn btn-dark" onclick="resetCatalogFilters()">Browse all bags</button>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map((p, i) => Clara.productCard(p, { index: i })).join("");
      Clara.observeReveals(grid);
    }

    function resetCatalogFilters() {
      activeCategory = "all";
      searchQuery = "";
      document.getElementById("catalogSearchInput").value = "";
      history.replaceState(null, "", "shop.html");
      renderChips(); renderHero(); renderCatalog();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.getElementById("catalogSearchInput");
      searchInput.value = searchQuery;
      searchInput.addEventListener("input", e => { searchQuery = e.target.value.trim().toLowerCase(); renderCatalog(); });
      document.getElementById("catalogSortSelect").addEventListener("change", e => { sortOrder = e.target.value; renderCatalog(); });

      renderChips();
      renderHero();
      renderCatalog();
      Clara.hydrateIcons();

      window.addEventListener("clara:wishlist-updated", () => {
        renderChips();
        if (activeCategory === "saved") renderCatalog();
      });
    });
  </script>
</body>
</html>
