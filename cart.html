<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag | CLARA Bags Sri Lanka</title>
  <meta name="description" content="Review your CLARA shopping bag, apply a voucher and choose delivery or showroom pickup.">
  <meta name="theme-color" content="#FBF7F3">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="cart">
  <script>Clara.header();</script>

  <main id="main">
    <section class="page-hero simple">
      <div class="container page-hero__inner">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep"></span><a href="shop.html">Shop</a><span class="sep"></span><span class="current">Your bag</span></nav>
        <h1 class="h2">Your <em>bag</em></h1>
        <div class="steps-bar"><span class="now"><i>1</i>Bag</span><span class="line"></span><span><i>2</i>Details &amp; payment</span><span class="line"></span><span><i>3</i>Confirmation</span></div>
      </div>
    </section>

    <section class="container section-tight">
      <div id="cartContentWrapper"></div>
    </section>

    <section class="section bg-ivory" id="cartSuggestions">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Before you go</span>
            <h2 class="h2" style="margin-top:14px">Pairs <em>beautifully</em> with</h2>
          </div>
          <a href="shop.html" class="link-underline">Shop all <span data-icon="arrow"></span></a>
        </div>
        <div class="product-grid" id="cartSuggestGrid"></div>
      </div>
    </section>
  </main>

  <script>Clara.footer();</script>

  <script>
    let selectedShipping = "western";
    const ic = Clara.icon;

    function renderCartPage() {
      const wrapper = document.getElementById("cartContentWrapper");
      const cart = getCart();
      const totals = calculateOrderTotals(selectedShipping);

      if (cart.length === 0) {
        wrapper.innerHTML = `
          <div class="panel empty-state" style="padding:72px 24px">
            <div class="bubble">${ic("bag")}</div>
            <h3>Your bag is empty</h3>
            <p>Explore structured vanity bags, work totes and evening clutches — there's something waiting for you.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px">
              <a href="shop.html" class="btn btn-rose">Shop the collection</a>
              <a href="shop.html?saved=1" class="btn btn-outline">${ic("heart")}View wishlist</a>
            </div>
          </div>`;
        renderSuggestions([]);
        return;
      }

      const free = totals.subtotal >= totals.freeDeliveryThreshold;
      const pct = Math.min(100, Math.round((totals.subtotal / totals.freeDeliveryThreshold) * 100));
      const shipOptions = [
        { key: "western", t: "Colombo &amp; Western Province", d: "1–2 business days", p: free ? "Free" : "Rs. 350" },
        { key: "islandwide", t: "Islandwide courier", d: "2–4 business days", p: free ? "Free" : "Rs. 550" },
        { key: "pickup", t: "Collect from our boutique", d: "587/A Galle Road, Mount Lavinia", p: "Free" }
      ];

      wrapper.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="panel" style="padding:0;overflow:hidden">
              <div class="ship-meter ${free ? "is-done" : ""}" style="padding:18px clamp(20px,3vw,34px)">
                ${free ? `${ic("check")} You've unlocked complimentary islandwide delivery`
                       : `You're <strong>${formatLKR(totals.amountNeededForFreeShipping)}</strong> away from complimentary delivery`}
                <div class="ship-meter__bar"><i style="width:${free ? 100 : pct}%"></i></div>
              </div>
              <div style="padding:clamp(20px,3vw,34px)">
                ${cart.map((item, idx) => {
                  const product = getProductById(item.productId);
                  const hex = product.colorHex[product.colors.indexOf(item.color)] || "#ccc";
                  return `
                  <div class="cart-row">
                    <a href="product.html?id=${item.productId}"><img src="${item.image}" alt="${item.name}"></a>
                    <div>
                      <h3><a href="product.html?id=${item.productId}">${item.name}</a></h3>
                      <div class="meta"><span><i style="background:${hex}"></i> ${item.color}</span><span>·</span><span>${formatLKR(item.price)}</span></div>
                      <div class="cart-row__actions">
                        <div class="qty">
                          <button type="button" onclick="updateCartQuantity(${idx}, ${item.quantity - 1})" aria-label="Decrease quantity">${ic("minus")}</button>
                          <span>${item.quantity}</span>
                          <button type="button" onclick="updateCartQuantity(${idx}, ${item.quantity + 1})" aria-label="Increase quantity">${ic("plus")}</button>
                        </div>
                        <button type="button" class="text-btn" onclick="removeFromCart(${idx})">${ic("trash")}Remove</button>
                      </div>
                    </div>
                    <div class="cart-row__total">${formatLKR(item.price * item.quantity)}</div>
                  </div>`;
                }).join("")}
                <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap">
                  <a href="shop.html" class="link-underline">${ic("chev-left")} Continue shopping</a>
                  <button type="button" class="text-btn" onclick="clearCart()">Clear bag</button>
                </div>
              </div>
            </div>
          </div>

          <aside class="sticky-col">
            <div class="panel">
              <div class="panel__title"><h2>Order summary</h2><small>${totals.totalItems} ${totals.totalItems === 1 ? "item" : "items"}</small></div>

              <div class="field" style="margin-bottom:22px">
                <label for="cartCouponInput">Voucher code</label>
                <div class="coupon">
                  <input type="text" id="cartCouponInput" placeholder="Enter code" value="${totals.coupon ? totals.coupon.code : ""}">
                  <button type="button" class="btn btn-dark" onclick="handleApplyCoupon()">Apply</button>
                </div>
                ${totals.coupon
                  ? `<span class="applied">${ic("check")}${totals.coupon.code} · ${totals.coupon.label}<button type="button" onclick="handleRemoveCoupon()" aria-label="Remove voucher">${ic("close")}</button></span>`
                  : `<p class="coupon-hint">First order? Try <button type="button" onclick="useCode('WELCOME10')">WELCOME10</button> for 10% off.</p>`}
              </div>

              <div class="field" style="margin-bottom:20px">
                <label>Delivery</label>
                <div>
                  ${shipOptions.map(o => `
                    <label class="radio-card">
                      <input type="radio" name="cartShipping" value="${o.key}" ${selectedShipping === o.key ? "checked" : ""} onchange="updateShippingSelection('${o.key}')">
                      <span><span class="radio-card__t">${o.t}</span><span class="radio-card__d" style="display:block">${o.d}</span></span>
                      <span class="radio-card__p ${o.p === "Free" ? "green" : ""}">${o.p}</span>
                    </label>`).join("")}
                </div>
              </div>

              <div class="summary-rows">
                <div><span class="muted">Subtotal</span><span>${formatLKR(totals.subtotal)}</span></div>
                ${totals.discountAmount > 0 ? `<div class="green"><span>Voucher (${totals.coupon.code})</span><span>−${formatLKR(totals.discountAmount)}</span></div>` : ""}
                <div><span class="muted">Delivery</span><span class="${totals.shippingFee === 0 ? "green" : ""}">${totals.shippingFee === 0 ? "Free" : formatLKR(totals.shippingFee)}</span></div>
              </div>
              <div class="summary-total"><span>Total</span><b>${formatLKR(totals.grandTotal)}</b></div>

              <a href="checkout.html" class="btn btn-rose btn-block" style="margin-top:20px">${ic("lock")}Secure checkout</a>
              <p class="secure-note">Card · Bank transfer · Cash on delivery</p>
            </div>
          </aside>
        </div>`;

      renderSuggestions(cart.map(i => i.productId));
    }

    function renderSuggestions(excludeIds) {
      const grid = document.getElementById("cartSuggestGrid");
      const list = CLARA_PRODUCTS.filter(p => !excludeIds.includes(p.id))
        .sort((a, b) => b.reviewCount - a.reviewCount).slice(0, 4);
      grid.innerHTML = list.map((p, i) => Clara.productCard(p, { index: i })).join("");
      Clara.observeReveals(grid);
    }

    function updateShippingSelection(method) { selectedShipping = method; renderCartPage(); }

    function handleApplyCoupon() {
      const res = applyCouponCode(document.getElementById("cartCouponInput").value);
      showToast(res.message);
      renderCartPage();
    }

    function useCode(code) {
      document.getElementById("cartCouponInput").value = code;
      handleApplyCoupon();
    }

    function handleRemoveCoupon() {
      removeAppliedCoupon();
      showToast("Voucher removed");
      renderCartPage();
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCartPage();
      window.addEventListener("clara:cart-updated", renderCartPage);
    });
  </script>
</body>
</html>
