<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | CLARA Sri Lanka</title>
  <meta name="description" content="Your CLARA shopping bag.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</head>
<body data-page="cart">
  <script>Clara.header();</script>

  <main id="main">
    <div class="container page-head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep"></span><span class="cur">Shopping bag</span></nav>
      <h1 class="title-lg">Shopping Bag</h1>
    </div>
    <div class="container" style="padding-bottom:clamp(64px,8vw,110px)">
      <div id="cartContentWrapper"></div>
    </div>

    <section class="section bg-paper" id="suggest">
      <div class="container">
        <div class="sec-head"><div><span class="kicker">Before you go</span><h2 class="title-lg">You May Also Like</h2></div><a href="shop.html" class="link">Shop all</a></div>
        <div class="grid" id="suggestGrid"></div>
      </div>
    </section>
  </main>

  <script>Clara.footer();</script>

  <script>
    let selectedShipping = "western";
    const ic = Clara.icon;

    function renderCartPage() {
      const wrap = document.getElementById("cartContentWrapper");
      const cart = getCart();
      const t = calculateOrderTotals(selectedShipping);

      if (!cart.length) {
        wrap.innerHTML = `<div class="empty">${ic("bag")}<h3>Your bag is empty</h3><p>Discover vanity bags, work totes and evening clutches from our latest collection.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a href="shop.html" class="btn">Shop handbags</a><a href="shop.html?saved=1" class="btn btn-outline">View wishlist</a></div></div>`;
        renderSuggest([]);
        return;
      }

      const free = t.subtotal >= t.freeDeliveryThreshold;
      const pct = Math.min(100, Math.round((t.subtotal / t.freeDeliveryThreshold) * 100));
      const opts = [
        ["western", "Colombo & Western Province", "1–2 business days", free ? "Free" : "Rs. 350"],
        ["islandwide", "Islandwide courier", "2–4 business days", free ? "Free" : "Rs. 550"],
        ["pickup", "Collect from our boutique", "587/A Galle Road, Mount Lavinia", "Free"]
      ];

      const qtyCtl = (idx, q) => `<div class="qty sm">
          <button type="button" onclick="updateCartQuantity(${idx}, ${q - 1})" aria-label="Decrease">${ic("minus")}</button><span>${q}</span>
          <button type="button" onclick="updateCartQuantity(${idx}, ${q + 1})" aria-label="Increase">${ic("plus")}</button></div>`;

      wrap.innerHTML = `
        <div class="cart">
          <div>
            <div class="ship-bar ${free ? "done" : ""}">
              ${free ? "Your order qualifies for complimentary islandwide delivery." : `Spend <b>${formatLKR(t.amountNeededForFreeShipping)}</b> more for complimentary islandwide delivery.`}
              <div class="ship-bar__track"><i style="width:${free ? 100 : pct}%"></i></div>
            </div>
            <table class="cart-table">
              <thead><tr><th>Product</th><th class="q">Quantity</th><th class="r">Total</th></tr></thead>
              <tbody>
                ${cart.map((item, idx) => `
                  <tr>
                    <td><div class="ci">
                      <a href="product.html?id=${item.productId}"><img src="${item.image}" alt="${item.name}"></a>
                      <div>
                        <h3><a href="product.html?id=${item.productId}">${item.name}</a></h3>
                        <div class="meta"><span>Colour: ${item.color}</span><span>${formatLKR(item.price)}</span></div>
                        <div class="m-only">${qtyCtl(idx, item.quantity)}<span>${formatLKR(item.price * item.quantity)}</span></div>
                        <button type="button" class="rm" onclick="removeFromCart(${idx})">Remove</button>
                      </div>
                    </div></td>
                    <td class="q">${qtyCtl(idx, item.quantity)}</td>
                    <td class="r">${formatLKR(item.price * item.quantity)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <div style="display:flex;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap">
              <a href="shop.html" class="link">Continue shopping</a>
              <button type="button" class="link" onclick="clearCart()">Clear bag</button>
            </div>
          </div>

          <aside class="summary">
            <h2>Order Summary</h2>
            <div class="sum-rows">
              <div><span>Subtotal (${t.totalItems} ${t.totalItems === 1 ? "item" : "items"})</span><span>${formatLKR(t.subtotal)}</span></div>
              ${t.discountAmount > 0 ? `<div class="green"><span>Voucher ${t.coupon.code}</span><span>−${formatLKR(t.discountAmount)}</span></div>` : ""}
              <div><span>Delivery</span><span class="${t.shippingFee === 0 ? "green" : ""}">${t.shippingFee === 0 ? "Free" : formatLKR(t.shippingFee)}</span></div>
            </div>

            <div style="margin-top:22px">
              ${opts.map(([k, title, desc, price]) => `
                <label class="ropt"><input type="radio" name="cartShipping" value="${k}" ${selectedShipping === k ? "checked" : ""} onchange="setShipping('${k}')">
                  <span><span class="ropt__t">${title}</span><span class="ropt__d">${desc}</span></span>
                  <span class="ropt__p ${price === "Free" ? "green" : ""}">${price}</span></label>`).join("")}
            </div>

            <div class="coupon">
              <input type="text" id="cartCouponInput" placeholder="Voucher code" value="${t.coupon ? t.coupon.code : ""}" aria-label="Voucher code">
              <button type="button" class="btn" onclick="applyCode()">Apply</button>
            </div>
            ${t.coupon
              ? `<p class="applied">${ic("check")} ${t.coupon.label} applied · <button type="button" onclick="removeCode()">Remove</button></p>`
              : `<p class="hint">First order? Use <button type="button" onclick="useCode('WELCOME10')">WELCOME10</button> for 10% off.</p>`}

            <div class="sum-total"><span>Total</span><b>${formatLKR(t.grandTotal)}</b></div>
            <a href="checkout.html" class="btn btn-block" style="margin-top:20px">Proceed to checkout</a>
            <p class="small center" style="margin-top:14px">Card · Bank transfer · Cash on delivery</p>
          </aside>
        </div>`;
      renderSuggest(cart.map(i => i.productId));
    }

    function renderSuggest(exclude) {
      const list = CLARA_PRODUCTS.filter(p => !exclude.includes(p.id)).sort((a, b) => b.reviewCount - a.reviewCount).slice(0, 4);
      document.getElementById("suggestGrid").innerHTML = list.map((p, i) => Clara.productCard(p, { index: i })).join("");
      Clara.observeReveals();
    }

    function setShipping(k) { selectedShipping = k; renderCartPage(); }
    function applyCode() { const r = applyCouponCode(document.getElementById("cartCouponInput").value); showToast(r.message); renderCartPage(); }
    function useCode(c) { document.getElementById("cartCouponInput").value = c; applyCode(); }
    function removeCode() { removeAppliedCoupon(); showToast("Voucher removed"); renderCartPage(); }

    document.addEventListener("DOMContentLoaded", () => {
      renderCartPage();
      window.addEventListener("clara:cart-updated", renderCartPage);
    });
  </script>
</body>
</html>
